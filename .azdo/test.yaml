resources:
  repositories:
  - repository: 'component-detection'
    type: github
    endpoint: github.com_johnterickson
    name: johnterickson/component-detection


variables:
  # Prefer targeted detectors first; if not supported, use the broad switch your org exposes:
  DisableSecureSupplyChainAnalysis: 'true'   # (name can vary by rollout)
  # Or: set all detectors you know are problematic to 'true'
  DisableDockerDetector: 'true'
  NugetSecurityAnalysisWarningLevel: 'none'
  skipNugetSecurityAnalysis: 'true'
  System.Debug: 'true'
  Codeql.SkipTaskAutoInjection: 'true'
  skipComponentGovernanceDetection: 'false'

jobs:
- job: Build
  displayName: 'Build on $(vmImage)'
  strategy:
    matrix:
      linux:
        vmImage: 'ubuntu-latest'
      mac:
        vmImage: 'macos-latest'
      windows:
        vmImage: 'windows-latest'
  pool:
    vmImage: $(vmImage)
  steps:
  - script: find $AGENT_HOMEDIRECTORY
  - task: UseDotNet@2
    inputs:
      useGlobalJson: true
  - script: dotnet run --project ".\src\Microsoft.ComponentDetection\Microsoft.ComponentDetection.csproj" -- scan --Verbosity Verbose --SourceDirectory . --DetectorArgs AzurePipelinesAgent=EnableIfDefaultOff
    displayName: 'Run Component Detection with AzurePipelinesAgent Detector Enabled'